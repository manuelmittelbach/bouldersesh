# Minimal Supabase project config for local development.
# Run `supabase init` once if you want the full file with all sections,
# or just use this skeleton + `supabase link --project-ref <ref>` for cloud-only work.

project_id = "bouldersesh"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
# Bewusst KEINE Redirect-URLs: Verify & Reset laufen über OTP-Codes, nicht über
# Links — es gibt keinen Web-OAuth-/Magic-Link-Rücklauf zu erlauben (ADR-0016).
additional_redirect_urls = []
jwt_expiry = 3600

[auth.email]
enable_signup = true
# Secure Email Change ist AUS (Industrie-Standard, wie Google/GitHub/Apple): der
# Email-Wechsel wird über eine Passwort-Re-Auth abgesichert und nur die NEUE Adresse
# bestätigt einen Code — die alte muss NICHT zustimmen. Bei `true` würde Supabase ZWEI
# Codes erzeugen (alte + neue Adresse); das verlangt Zugriff aufs alte Postfach und
# bricht den häufigsten Wechselgrund („komme ans alte Postfach nicht mehr ran"). Die
# Re-Auth (signInWithPassword vor updateUser, siehe queries/account.ts → useChangeEmail)
# hält die Sicherheit: nur wer das Passwort kennt UND das neue Postfach kontrolliert,
# kann wechseln.
double_confirm_changes = false
# Email-Bestätigung ist AN (ADR-0016): unbestätigte, potenziell gefälschte Accounts
# dürfen bei einer Kontakt-App nicht schon anfragen/schreiben. Verifiziert wird per
# 8-stelligem OTP-Code (verifyOtp), NICHT per Link → kein Deep-Linking nötig.
enable_confirmations = true

# OTP-Länge = 8, MUSS zur App passen: der Verify-Screen (auth/verify.tsx,
# CODE_LENGTH = 8) und OtpInput haben genau 8 Felder. Das Live-Projekt steht auf 8
# (Default) — dieser Wert hält die lokale Config damit deckungsgleich, damit ein
# 'config push' die Länge nicht versehentlich auf etwas anderes zieht.
otp_length = 8

# WICHTIG — nur am LIVE-Projekt (Dashboard), nicht in dieser lokalen config:
#   1. Email-Templates „Confirm signup", „Reset password" UND „Change Email Address"
#      auf {{ .Token }} umstellen (statt {{ .ConfirmationURL }}), damit die Mails den
#      CODE tragen — der In-App-Verify-Screen nimmt einen Code, keinen Link.
#   2. Leaked-Password-Protection aktivieren
#      (Authentication → Policies → „Prevent use of leaked passwords").
#   3. Kein Site-URL/Redirect fürs Deep-Linking einrichten — bewusst nicht gebraucht.
#   4. „Secure email change" AUS (Authentication → Providers → Email) — spiegelt das
#      double_confirm_changes = false oben; sonst kämen ZWEI Codes statt einem.
# Externe Voraussetzungen für Social-Login (Apple Dev Account, Google OAuth
# Client-IDs) werden separat nachgezogen; die App zeigt die Buttons bis dahin
# deaktiviert.

[functions.send-push]
# KEIN User-JWT am Gateway: Aufrufer sind die DB-Trigger (Migration 0029), die
# das Vault-Secret 'push_fn_secret' als Bearer schicken — das ist kein JWT, mit
# Default-Verify käme jeder Trigger-Call als 401 zurück, bevor die Function ihren
# eigenen Secret-Vergleich machen kann. Live gesetzt beim Deploy (2026-08-05).
# Manuelle Voraussetzungen am LIVE-Projekt (beide erledigt 2026-08-05):
#   1. Vault-Secret: select vault.create_secret('<secret>', 'push_fn_secret');
#      — fehlt es, steigt notify_push still aus (kein Push, DML läuft weiter).
#   2. Android-Pushes: FCM-V1-Service-Account-JSON in den EAS-Credentials
#      (npx eas-cli credentials -p android → Google Service Account / FCM V1).
verify_jwt = false
