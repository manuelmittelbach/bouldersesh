<!-- @dsCard group="Components" viewport="700x440" name="SessionCard · BottomNav · Chat" subtitle="Composed app units: feed card, tab bar, chat bubbles" -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); color: var(--text-strong); }
    .wrap { padding: 24px; display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
    .label { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .navbox { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
    .chat { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    [data-lucide] { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div id="root" class="wrap"></div>
  <script type="text/babel">
    const { SessionCard, BottomNav, MessageBubble, Badge } = window.BoulderBuddyDesignSystem_019e12;
    const I = (n) => <i data-lucide={n}></i>;

    function Demo() {
      const [tab, setTab] = React.useState("home");
      return (
        <>
          <div>
            <div className="label">SessionCard</div>
            <div className="stack">
              <SessionCard
                name="Lina K." avatarTone="orange" grade="6a – 6c" band="intermediate" online
                time="Heute · 18:00 – 21:00" gym="Boulderwelt München-Ost"
                note="Suche jemand zum Projekt-Bouldern. Versuche mich an einem 6c+ in der gelben Ecke."
                timeIcon={I("clock")} gymIcon={I("map-pin")}
                footer={<Badge tone="success" icon={I("check-circle-2")}>Passt zu deinem Level</Badge>}
                onClick={() => {}}
              />
              <SessionCard
                name="Sami R." avatarTone="moss" grade="7a+" band="advanced"
                time="Fr, 29. Mai · 17:00" gym="Einstein Boulderhalle"
                note="Power-Session. Suche jemand auf ähnlichem Niveau zum Spotten."
                timeIcon={I("clock")} gymIcon={I("map-pin")}
                footer={<Badge tone="warning" icon={I("arrow-up-right")}>Stretch-Level</Badge>}
                onClick={() => {}}
              />
            </div>
          </div>

          <div>
            <div className="label">BottomNav</div>
            <div className="navbox">
              <BottomNav
                active={tab} onSelect={setTab}
                items={[
                  { key: "home", label: "Home", icon: I("home") },
                  { key: "chats", label: "Chats", icon: I("message-circle"), badge: true },
                  { key: "profile", label: "Profil", icon: I("user") },
                ]}
              />
            </div>

            <div className="label" style={{ marginTop: 22 }}>Chat</div>
            <div className="chat">
              <MessageBubble>Hey Manu! Cool, dass du Bock hast.</MessageBubble>
              <MessageBubble>Bin um 18 Uhr am Empfang. Magst du dich davor warm machen?</MessageBubble>
              <MessageBubble mine time="9:43">Zusammen warm machen klingt gut!</MessageBubble>
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    requestAnimationFrame(() => window.lucide && window.lucide.createIcons());
  </script>
</body>
</html>
