<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); color: var(--text-strong); }
    .wrap { padding: 22px; display: flex; flex-direction: column; gap: 8px; }
    .r { display: flex; align-items: baseline; gap: 16px; }
    .t { font-family: var(--font-display); font-weight: 600; letter-spacing: var(--tracking-snug); line-height: 1.1; }
    .k { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 92px; flex: 0 0 auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="r"><span class="k">4xl · 48</span><span class="t" style="font-size:48px">Klettern</span></div>
    <div class="r"><span class="k">3xl · 38</span><span class="t" style="font-size:38px">Klettern</span></div>
    <div class="r"><span class="k">2xl · 30</span><span class="t" style="font-size:30px">Klettern</span></div>
    <div class="r"><span class="k">xl · 24</span><span class="t" style="font-size:24px">Klettern</span></div>
    <div class="r"><span class="k">lg · 20</span><span class="t" style="font-size:20px">Klettern</span></div>
    <div class="r"><span class="k">md · 17</span><span class="t" style="font-size:17px">Klettern</span></div>
    <div class="r"><span class="k">base · 15</span><span class="t" style="font-size:15px">Klettern</span></div>
    <div class="r"><span class="k">sm · 13</span><span class="t" style="font-size:13px">Klettern</span></div>
    <div class="r"><span class="k">xs · 12</span><span class="t" style="font-size:12px">Klettern</span></div>
  </div>
</body>
</html>
