<!-- @dsCard group="Type" viewport="700x150" name="Mono — JetBrains Mono" subtitle="Climbing grades, timestamps, numerals · the technical accent" -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); }
    .wrap { padding: 24px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
    .m { font-family: var(--font-mono); font-weight: 700; color: var(--text-strong); }
    .meta { width: 100%; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="m" style="font-size:34px">6c+</span>
    <span class="m" style="font-size:34px">7a</span>
    <span class="m" style="font-size:34px;color:var(--brand)">8a</span>
    <span class="m" style="font-size:18px;color:var(--text-muted)">18:00 – 21:00</span>
    <span class="m" style="font-size:18px;color:var(--text-faint)">9:43</span>
    <div class="meta">JetBrains Mono · 600/700 · grades read as data, never as prose</div>
  </div>
</body>
</html>
