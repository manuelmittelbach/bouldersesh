<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid · 1 → 16" -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); color: var(--text-strong); }
    .wrap { padding: 22px; display: flex; align-items: flex-end; gap: 14px; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bar { background: var(--brand); border-radius: 3px; width: 100%; }
    .box { width: 30px; display: flex; flex-direction: column; align-items: center; }
    .k { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:var(--space-1)"></div><span class="k">1·4</span></div>
    <div class="col"><div class="bar" style="height:var(--space-2)"></div><span class="k">2·8</span></div>
    <div class="col"><div class="bar" style="height:var(--space-3)"></div><span class="k">3·12</span></div>
    <div class="col"><div class="bar" style="height:var(--space-4)"></div><span class="k">4·16</span></div>
    <div class="col"><div class="bar" style="height:var(--space-5)"></div><span class="k">5·20</span></div>
    <div class="col"><div class="bar" style="height:var(--space-6)"></div><span class="k">6·24</span></div>
    <div class="col"><div class="bar" style="height:var(--space-8)"></div><span class="k">8·32</span></div>
    <div class="col"><div class="bar" style="height:var(--space-10)"></div><span class="k">10·40</span></div>
    <div class="col"><div class="bar" style="height:var(--space-12)"></div><span class="k">12·48</span></div>
    <div class="col"><div class="bar" style="height:var(--space-16)"></div><span class="k">16·64</span></div>
  </div>
</body>
</html>
