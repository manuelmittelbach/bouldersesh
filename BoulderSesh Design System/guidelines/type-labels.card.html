<!-- @dsCard group="Type" viewport="700x130" name="Labels & eyebrows" subtitle="Uppercase Inter, wide tracking — section labels above fields" -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); }
    .wrap { padding: 24px; display: flex; gap: 40px; flex-wrap: wrap; }
    .lab { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: var(--tracking-caps); font-weight: 600; color: var(--text-muted); }
    .val { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); color: var(--text-strong); margin-top: 4px; }
    .meta { width: 100%; margin-top: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div><div class="lab">Wann?</div><div class="val">Heute · 18:00</div></div>
    <div><div class="lab">Wunsch-Level</div><div class="val">6a – 6c</div></div>
    <div><div class="lab">Sichtbar für</div><div class="val">Alle</div></div>
    <div class="meta">Inter 600 · uppercase · tracking +0.08em · 11px</div>
  </div>
</body>
</html>
