<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows" subtitle="Low, cool, single-source · brand glow reserved for the FAB" -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); color: var(--text-strong); }
    .wrap { padding: 30px 22px; display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .b { width: 84px; height: 56px; background: var(--surface-card); border-radius: var(--radius-lg); }
    .fab { width: 56px; height: 56px; border-radius: var(--radius-pill); background: var(--brand); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; }
    .k { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="b" style="box-shadow:var(--shadow-xs)"></div><span class="k">xs</span></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-sm)"></div><span class="k">sm · cards</span></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-md)"></div><span class="k">md</span></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-lg)"></div><span class="k">lg · sheets</span></div>
    <div class="col"><div class="fab" style="box-shadow:var(--shadow-brand)">+</div><span class="k">brand glow · FAB</span></div>
  </div>
</body>
</html>
