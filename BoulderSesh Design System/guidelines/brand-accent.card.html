<!-- @dsCard group="Brand" viewport="700x180" name="The orange moment" subtitle="One bold accent per view: the primary action, the FAB, the match" -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); color: var(--text-strong); }
    .wrap { padding: 24px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .cta { display: inline-flex; align-items: center; gap: 8px; background: var(--brand); color: #fff; font-weight: 600; font-size: var(--text-base); padding: 13px 20px; border-radius: var(--radius-md); }
    .cta [data-lucide] { width: 16px; height: 16px; }
    .fab { width: 56px; height: 56px; border-radius: var(--radius-pill); background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-brand); }
    .fab [data-lucide] { width: 26px; height: 26px; }
    .note { font-size: var(--text-sm); color: var(--text-muted); max-width: 230px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="cta"><i data-lucide="hand"></i> Klettern mit?</div>
    <div class="fab"><i data-lucide="plus"></i></div>
    <div class="note">Orange is a punctuation mark, not a wash. Surround it with rock neutrals so the one hit lands.</div>
  </div>
  <script>requestAnimationFrame(() => lucide.createIcons());</script>
</body>
</html>
