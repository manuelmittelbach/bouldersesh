<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { margin: 0; background: var(--surface-app); font-family: var(--font-ui); color: var(--text-strong); }
    .wrap { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; align-items: start; }
    .label { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    [data-lucide] { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div id="root" class="wrap"></div>
  <script type="text/babel">
    const { Input, Chip } = window.BoulderSeshDesignSystem_019e12;
    const I = (n) => <i data-lucide={n}></i>;

    function Demo() {
      return (
        <>
          <div>
            <Input label="E-Mail" type="email" defaultValue="manu@boulder.cc" icon={I("mail")} />
          </div>
          <div>
            <Input label="Halle" error="Bitte eine Halle wählen" icon={I("map-pin")} defaultValue="" placeholder="Halle suchen…" />
          </div>
          <div style={{ gridColumn: "1 / -1" }}>
            <Input label="Notiz (optional)" as="textarea" rows={2}
              defaultValue="Suche jemand zum Projekt-Bouldern an einem 6c+ in der gelben Ecke." />
          </div>
          <div style={{ gridColumn: "1 / -1" }}>
            <div className="label">Filter chips</div>
            <div className="chips">
              <Chip active icon={I("map-pin")} trailingIcon={I("chevron-down")}>Boulderwelt München</Chip>
              <Chip icon={I("calendar")}>Heute &amp; morgen</Chip>
              <Chip icon={I("trending-up")}>Mein Level ± 1</Chip>
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    requestAnimationFrame(() => window.lucide && window.lucide.createIcons());
  </script>
</body>
</html>
