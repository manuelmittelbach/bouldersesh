<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1290px; height:2796px; }
  :root{
    --brand:#f25c16; --brand600:#d8480a; --brand700:#b3380c;
    --rock900:#16181d; --rock800:#23272f; --rock500:#646c7d; --rock100:#e6e9ee;
    --green:#1f7a52; --greenbg:#e3f3ec; --blue:#2664a8; --bluebg:#e2edf7;
  }
  .tile{
    width:1290px; height:2796px; position:relative; overflow:hidden;
    font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
    background:linear-gradient(160deg,#ff7a3d 0%, #f25c16 42%, #b3380c 100%);
    display:flex; flex-direction:column; align-items:center;
  }
  /* soft glow accents */
  .tile::before{content:"";position:absolute;top:-260px;right:-200px;width:820px;height:820px;
    background:radial-gradient(circle,rgba(255,255,255,.28),transparent 62%);}
  .tile::after{content:"";position:absolute;bottom:-320px;left:-220px;width:900px;height:900px;
    background:radial-gradient(circle,rgba(0,0,0,.22),transparent 60%);}

  .cap{ z-index:2; text-align:center; padding:150px 110px 0; }
  .eyebrow{ color:rgba(255,255,255,.82); font-size:34px; font-weight:700;
    letter-spacing:6px; text-transform:uppercase; margin-bottom:26px; }
  .head{ color:#fff; font-size:104px; line-height:1.03; font-weight:800;
    letter-spacing:-2px; text-shadow:0 4px 30px rgba(0,0,0,.18); }

  /* phone */
  .phone-wrap{ z-index:2; margin-top:96px; filter:drop-shadow(0 60px 90px rgba(0,0,0,.42)); }
  .phone{ width:912px; height:1868px; background:#0b0c0f; border-radius:120px;
    padding:22px; }
  .screen{ width:100%; height:100%; background:#f7f8fa; border-radius:100px;
    overflow:hidden; position:relative; }
  .island{ position:absolute; top:34px; left:50%; transform:translateX(-50%);
    width:220px; height:64px; background:#0b0c0f; border-radius:40px; z-index:5; }

  /* ---- placeholder app screen (feed) ---- */
  .status{ height:120px; }
  .appbar{ padding:20px 56px 0; display:flex; align-items:center; justify-content:space-between; }
  .brandrow{ display:flex; align-items:center; gap:18px; }
  .logo{ width:70px; height:70px; border-radius:22px;
    background:linear-gradient(150deg,#fb7a3c,#d8480a); display:flex;align-items:center;justify-content:center;}
  .logo span{ color:#fff; font-weight:800; font-size:40px; }
  .wordmark{ font-size:44px; font-weight:800; color:var(--rock900); letter-spacing:-1px;}
  .city{ font-size:32px; font-weight:700; color:var(--brand700);
    background:#ffe4d2; padding:14px 26px; border-radius:30px; }
  .h1{ padding:52px 56px 6px; font-size:64px; font-weight:800; color:var(--rock900); letter-spacing:-1.5px;}
  .sub{ padding:0 56px 20px; font-size:34px; color:var(--rock500); font-weight:600;}

  .card{ margin:26px 44px 0; background:#fff; border-radius:44px; padding:44px;
    box-shadow:0 20px 45px -22px rgba(22,24,29,.30); }
  .crow{ display:flex; align-items:center; gap:30px; }
  .av{ width:112px; height:112px; border-radius:36px; flex:none; display:flex;align-items:center;justify-content:center;
    font-size:46px; font-weight:800; color:#fff;}
  .a1{background:linear-gradient(150deg,#fb7a3c,#d8480a);}
  .a2{background:linear-gradient(150deg,#4f9be0,#2664a8);}
  .a3{background:linear-gradient(150deg,#57c08a,#1f7a52);}
  .who{ flex:1; }
  .who b{ display:block; font-size:44px; font-weight:800; color:var(--rock900); }
  .who span{ display:block; font-size:32px; color:var(--rock500); font-weight:600; margin-top:6px;}
  .pill{ font-size:30px; font-weight:800; padding:14px 28px; border-radius:26px; }
  .pg{ color:var(--green); background:var(--greenbg); }
  .pb{ color:var(--blue); background:var(--bluebg); }
  .meta{ display:flex; gap:20px; margin-top:34px; }
  .chip{ font-size:31px; font-weight:700; color:var(--rock800); background:var(--rock100);
    padding:16px 30px; border-radius:26px; }
  .cta{ margin-top:36px; background:var(--brand); color:#fff; text-align:center;
    font-size:40px; font-weight:800; padding:30px; border-radius:34px; }
  .fab{ position:absolute; right:70px; bottom:150px; width:150px; height:150px; border-radius:50px;
    background:linear-gradient(150deg,#fb7a3c,#d8480a); box-shadow:0 24px 50px -12px rgba(216,72,10,.7);
    display:flex;align-items:center;justify-content:center; color:#fff; font-size:88px; font-weight:300;}
  .nav{ position:absolute; left:0; right:0; bottom:0; height:150px; background:#fff;
    border-top:2px solid #eef0f3; display:flex; align-items:center; justify-content:space-around; padding:0 40px;}
  .ni{ width:70px; height:70px; border-radius:22px; background:#e6e9ee;}
  .ni.on{ background:var(--brand); }
</style>
</head>
<body>
  <div class="tile">
    <div class="cap">
      <div class="eyebrow">BoulderSesh</div>
      <div class="head">Never boulder<br>alone again</div>
    </div>

    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <div class="island"></div>
          <div class="status"></div>
          <div class="appbar">
            <div class="brandrow">
              <div class="logo"><span>B</span></div>
              <div class="wordmark">BoulderSesh</div>
            </div>
            <div class="city">Berlin</div>
          </div>
          <div class="h1">Who's climbing?</div>
          <div class="sub">3 sessions near you today</div>

          <div class="card">
            <div class="crow">
              <div class="av a1">M</div>
              <div class="who"><b>Mara</b><span>Boulderklub · 18:30</span></div>
              <div class="pill pg">Beginner</div>
            </div>
            <div class="meta"><div class="chip">2 going</div><div class="chip">Today</div></div>
            <div class="cta">Join session</div>
          </div>

          <div class="card">
            <div class="crow">
              <div class="av a2">J</div>
              <div class="who"><b>Jonas</b><span>Berta Block · 19:00</span></div>
              <div class="pill pb">Advanced</div>
            </div>
            <div class="meta"><div class="chip">4 going</div><div class="chip">Today</div></div>
          </div>

          <div class="fab">+</div>
          <div class="nav"><div class="ni on"></div><div class="ni"></div><div class="ni"></div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
